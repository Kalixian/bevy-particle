[package]
name = "bevy-particle"
version = "0.1.0"
edition = "2024"

[features]
default = ["editor"]
# The demo app's editor panel. Libraries using this crate can turn it off with
# `default-features = false`.
editor = ["dep:bevy_egui"]
# Logs per-pass GPU timings every 2 seconds and turns vsync off: `cargo run --features profile`
profile = []
# Reloads shaders and effects when they're saved: `cargo run --features hot-reload`
hot-reload = ["bevy/file_watcher", "bevy/embedded_watcher"]

[dependencies]
# Only the 2D parts of Bevy, which keeps builds and the web download smaller. The camera's
# tonemapper needs tonemapping_luts, which is zstd-compressed.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "serialize", "tonemapping_luts", "zstd_rust"] }
# Drawn by its own camera (see src/bin/bevy-particle/editor), so Bevy's UI isn't needed.
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard"], optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

# Validates the shaders in tests. Keep in step with the naga that Bevy uses.
[dev-dependencies]
naga = { version = "30.0.2", features = ["wgsl-in"] }

# Compute shaders and storage buffers need WebGPU; Bevy's web default is WebGL2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["webgpu"] }

# Used by scripts/build-web.ps1: small downloads matter more than build time.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
# Function names are removed later, by wasm-bindgen.
strip = "debuginfo"
