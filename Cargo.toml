[package]
name = "bevy-particle"
version = "0.1.0"
edition = "2024"

[features]
# Logs per-pass GPU timings every 2 seconds and turns vsync off: `cargo run --features profile`
profile = []
# Reloads assets (shaders and demos.ron) when they're saved: `cargo run --features hot-reload`
hot-reload = ["bevy/file_watcher"]

[dependencies]
# Only the 2D parts of Bevy, which keeps builds and the web download smaller. The camera's
# tonemapper needs tonemapping_luts, which is zstd-compressed.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "serialize", "tonemapping_luts", "zstd_rust"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

# Compute shaders and storage buffers need WebGPU; Bevy's web default is WebGL2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["webgpu"] }

# Used by scripts/build-web.ps1: small downloads matter more than build time.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
# Function names are removed later, by wasm-bindgen.
strip = "debuginfo"
